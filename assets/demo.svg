<svg xmlns="http://www.w3.org/2000/svg" width="740" height="660" viewBox="0 0 740 660" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d6e5"/>
      <stop offset="1" stop-color="#b3c4d8"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="740" height="660" rx="18" fill="url(#wall)"/>

  <!-- header -->
  <rect x="0" y="0" width="740" height="64" rx="18" fill="#517da2"/>
  <rect x="0" y="30" width="740" height="34" fill="#517da2"/>
  <circle cx="44" cy="32" r="20" fill="#3f6688"/>
  <text x="44" y="38" text-anchor="middle" font-size="19" fill="#dfeaf3">🧭</text>
  <text x="76" y="28" font-size="17" font-weight="600" fill="#ffffff">AI integrated coach</text>
  <text x="76" y="47" font-size="13" fill="#c9dced">интегративный коуч · память профиля</text>

  <!-- user bubble (right) -->
  <g filter="url(#sh)">
    <rect x="250" y="88" width="466" height="72" rx="14" fill="#eaffd6"/>
  </g>
  <text font-size="15.5" fill="#1a2733">
    <tspan x="270" y="115">Не могу заставить себя начать важный проект —</tspan>
    <tspan x="270" y="138">откладываю каждый день, а вечером злюсь на себя.</tspan>
  </text>
  <text x="700" y="153" text-anchor="end" font-size="11" fill="#6f9c5a">09:41 ✓✓</text>

  <!-- coach bubble (left) -->
  <g filter="url(#sh)">
    <rect x="24" y="176" width="612" height="356" rx="14" fill="#ffffff"/>
  </g>
  <text font-size="15.5" fill="#1a2733">
    <tspan x="44" y="206" font-weight="600">Похоже, это петля: откладывание → вечерний стыд →</tspan>
    <tspan x="44" y="228" font-weight="600">меньше ресурса начать. Это не лень.</tspan>

    <tspan x="44" y="262">Три возможных механизма:</tspan>
    <tspan x="44" y="288">• <tspan fill="#517da2" font-weight="600">Задача не расщеплена</tspan> — мозг избегает её как</tspan>
    <tspan x="60" y="308">угрозу. <tspan fill="#8a97a3" font-size="13">(Behavior Design + ACT)</tspan></tspan>
    <tspan x="44" y="334">• <tspan fill="#517da2" font-weight="600">Скрытое «обязательство не начинать»</tspan> —</tspan>
    <tspan x="60" y="354">откладывание как защита. <tspan fill="#8a97a3" font-size="13">(Immunity to Change)</tspan></tspan>
    <tspan x="44" y="380">• <tspan fill="#517da2" font-weight="600">Истощение</tspan>, и «заставить себя» только добьёт.</tspan>
    <tspan x="60" y="400"><tspan fill="#8a97a3" font-size="13">(окно толерантности + IFS)</tspan></tspan>

    <tspan x="44" y="436" font-weight="600">Эксперимент на 24 ч:</tspan>
    <tspan x="44" y="460">запиши первый шаг ≤ 15 минут, конкретный. Сделай</tspan>
    <tspan x="44" y="480">только его. Вечером — одно наблюдение вместо гнева:</tspan>
    <tspan x="44" y="500">труднее было <tspan font-style="italic">сделать</tspan> шаг или <tspan font-style="italic">начать</tspan> его?</tspan>
  </text>
  <text x="616" y="518" text-anchor="end" font-size="11" fill="#9aa7b3">09:41</text>

  <!-- memory chip -->
  <g filter="url(#sh)">
    <rect x="24" y="552" width="692" height="84" rx="14" fill="#f4f7fb"/>
  </g>
  <text x="44" y="580" font-size="13.5" font-weight="600" fill="#517da2">🧠 /memory — что бот запомнил</text>
  <text font-size="13.5" fill="#41505e">
    <tspan x="44" y="604">Паттерн: откладывание больших задач при лёгкости с мелкими.</tspan>
    <tspan x="44" y="624">Открытая тема: порог входа vs дисциплина — проверяется экспериментом.</tspan>
  </text>
</svg>
